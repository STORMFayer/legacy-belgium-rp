name = "lb-staff-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# KV : stockage des avertissements + journal des actions.
# Crée le namespace puis colle son id ci-dessous :
#   wrangler kv namespace create LB_STAFF
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "LB_STAFF"
id = "606ebb6ed535488b863fba6d20c583c4"

# ---------------------------------------------------------------------------
# Secrets (NE PAS mettre ici — utiliser `wrangler secret put <NOM>`) :
#   DISCORD_BOT_TOKEN   (obligatoire)
#   FIVEM_URL           (optionnel — URL publique de la ressource lb_staffbridge)
#   FIVEM_SECRET        (optionnel — doit valoir la convar lb_staff_secret)
# ---------------------------------------------------------------------------

# La config non secrète (guild, paliers, salon d'annonce…) est dans src/config.js
